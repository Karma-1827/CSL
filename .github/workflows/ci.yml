name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-check for newly disclosed CVEs in pinned dependencies even when nobody
    # pushes code that week (docs/VULNERABILITY_SCAN_IMPROVEMENTS.md batch 1/5.5).
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: csl_ci
          POSTGRES_USER: csl_ci
          POSTGRES_PASSWORD: csl_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: csl_ci
      POSTGRES_USER: csl_ci
      POSTGRES_PASSWORD: csl_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff — real-bug rules only, see pyproject.toml)
        run: ruff check .

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test --verbosity 2

      - name: Deployment checks (DEBUG off)
        env:
          DJANGO_DEBUG: "0"
        run: python manage.py check --deploy
