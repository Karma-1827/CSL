<section class="form-section consent-section">
  <div class="check-field{% if form.agree.errors %} has-error{% endif %}">
    {{ form.agree }}
    <label for="{{ form.agree.id_for_label }}">{{ form.agree.label }}</label>
  </div>
  {% for error in form.agree.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</section>
