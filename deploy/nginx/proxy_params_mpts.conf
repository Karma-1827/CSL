# Shared reverse-proxy headers for every location that forwards to Gunicorn.
# Included from deploy/nginx/mpts.conf.example — kept in its own file so both the
# /system-admin/ location and the general location can't drift out of sync.
#
# X-Forwarded-For is deliberately SET to $remote_addr, not appended via
# $proxy_add_x_forwarded_for. $proxy_add_x_forwarded_for appends nginx's view of the
# client to whatever X-Forwarded-For value the client already sent — which means a
# spoofed header a client sends itself ends up as the FIRST value in the forwarded
# header, and Django's client_ip() (accounts/forms.py) reads exactly that first value.
# Overwriting instead of appending is correct here because Nginx is the single trusted
# entry point in front of Gunicorn (Gunicorn only binds a Unix socket, see
# deploy/gunicorn.conf.py) — there is no other proxy hop whose forwarded value would need
# preserving. If a CDN/WAF is ever added in front of Nginx, this needs to change to trust
# and forward that layer's header instead (docs/VULNERABILITY_SCAN_IMPROVEMENTS.md batch 5
# item "修正來源 IP").
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_redirect off;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
